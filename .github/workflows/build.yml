name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    name: Linux (.deb)
    # 22.04 = glibc mais antigo, o binário roda em mais distribuições
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Native AOT precisa de clang e zlib para linkar
      - name: Dependências de build
        # xvfb: o --export-icons do app inicializa o Avalonia e precisa de um display X11
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb

      - name: Gerar .deb
        run: xvfb-run -a packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LenoShot-deb
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows (installer .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Compila (Native AOT), embute o ffmpeg e gera o instalador em dist/
      - name: Gerar instalador
        shell: pwsh
        run: ./packaging/build-windows.ps1 -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: LenoShot-windows
          path: dist/*-setup.exe
          if-no-files-found: error

  # Cada push na main com uma versão nova no csproj gera a tag e o release sozinho.
  # Push sem mudar o <Version> não publica nada.
  release:
    name: Publicar release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deb, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão
        id: version
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' LenoShot/LenoShot.csproj)"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "A tag v$VERSION já existe: nenhum release novo."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # O app confere o hash antes de instalar uma atualização
      - name: Gerar SHA256SUMS
        if: steps.version.outputs.new == 'true'
        run: cd artifacts && sha256sum * > SHA256SUMS

      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
